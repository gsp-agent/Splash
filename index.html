<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrooveTech Prototype — Clay study</title>
    <style>
      body, html {
        height: 100%;
        width: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overscroll-behavior: none; 
        overflow: hidden; 
        background: #d2d2d2;
        color: #292929;
        font-family: Arial, Helvetica, sans-serif;
      }
      
      canvas {
        width: 100%;
        height: 100%;
      }

      #brand {
        position: fixed;
        top: 28px;
        left: 28px;
        z-index: 1;
        pointer-events: none;
      }

      #brand img {
        display: block;
        width: 160px;
        height: auto;
      }

      #brand p {
        margin: 15px 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        white-space: nowrap;
      }

      #ui-container {
        position: fixed; 
        top: 185px;
        left: 28px;
        width: 300px; 
        font-size: 13px;
        line-height: 1.8;
      }

      #number-container {
        position: fixed; 
        top: 0; 
        right: 0; 
        margin: 20px;
        margin-right: 10px;
        font-size: 15px;
        width: 270px;
      }

      #debug-info {
        position: fixed; 
      }
      #howto-container {
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 300px; 
        margin: 20px; 
        font-size: small;
      }
      #github-link {
        position:fixed;
        bottom: 0;
        right: 0;
      }
      .github-icon {
        position: absolute;
        bottom: 10px;
        right: 20px;
        font-size: 40px;
        color: black; 
      }
      * {
        user-select: none; 
      }

      @media (max-width: 640px) {
        #brand {
          top: 20px;
          left: 20px;
        }
        #brand img {
          width: 116px;
        }
        #brand p {
          margin-top: 12px;
          font-size: 9px;
          letter-spacing: 1.5px;
        }
        #ui-container {
          top: 140px;
          left: 20px;
          width: calc(100% - 40px);
        }
        .lil-gui.root {
          top: 215px;
          right: 20px;
          max-height: calc(100dvh - 370px);
          max-width: calc(100vw - 40px);
        }
      }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  </head>
  <body>
    <header id="brand">
      <img src="./GJ-logo-stacked-BLACK.svg" alt="Groove Jones" width="241" height="154" />
      <p>GROOVETECH PROTOTYPE</p>
    </header>
    <div id="ui-container">
      <div style="display: flex; flex-direction: column;">
        <label>
          <input type="checkbox" id="particle"> Particles
        </label>
      </div>
      <div id="slider-container">
        <label for="slider">Box Width:</label>
        <input type="range" id="slider" min="0" max="100" value="100" />
        <span id="slider-value"></span>
      </div>
    </div>
    <div id="howto-container">
      <div><b>Move pointer</b> to stir the fluid</div>
      <div> <b>Drag</b> to move camera </div>
      <div> <b>Scroll</b> to zoom in and out </div>
      <div> <b>Press P</b> to pause the simulation </div>
      <div>Thickness changes resistance; speed is separate.</div>
      <div>Presets are exploratory liquids, not calibrated materials.</div>
    </div>
    <div id="debug-info">
      <span id="error-reason">loading now...(won't take longer than 10 seconds I guess)</span>
    </div>
    <a href="https://github.com/matsuoka-601/Splash" 
      class="github-icon" 
      target="_blank" 
      rel="noopener noreferrer">
        <i class="fab fa-github"></i>
    </a>
    <canvas id="fluidCanvas"></canvas>
    <script type="module" src="main.ts"></script>
  </body>
</html>
